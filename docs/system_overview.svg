<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="680" height="300" fill="#0a0e1a"/>

  <!-- STM32 -->
  <rect x="20" y="95" width="155" height="85" rx="10" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="97" y="122" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#a78bfa">STM32 Blue Pill</text>
  <text x="97" y="140" text-anchor="middle" font-family="monospace" font-size="10" fill="#7c70c0">HAL C · master</text>
  <text x="97" y="156" text-anchor="middle" font-family="monospace" font-size="10" fill="#7c70c0">RGB LED · LCD · UART</text>

  <!-- ESP32 -->
  <rect x="235" y="95" width="155" height="85" rx="10" fill="#0c1a3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="312" y="122" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#60a5fa">ESP32</text>
  <text x="312" y="140" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a6a9c">Arduino IDE · slave</text>
  <text x="312" y="156" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a6a9c">DHT11 · WiFi · MQTT</text>

  <!-- Mosquitto -->
  <rect x="450" y="50" width="150" height="65" rx="10" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/>
  <text x="525" y="78" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#4ade80">Mosquitto</text>
  <text x="525" y="96" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a7a5c">PC broker · :1883</text>
  <text x="525" y="108" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a7a5c">WebSocket · :9001</text>

  <!-- Dashboard -->
  <rect x="450" y="180" width="150" height="65" rx="10" fill="#1c1005" stroke="#d97706" stroke-width="1.5"/>
  <text x="525" y="205" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">Dashboard</text>
  <text x="525" y="223" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a6030">HTML · WebSocket</text>
  <text x="525" y="236" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a6030">Chrome / Edge</text>

  <!-- RGB LED -->
  <rect x="20" y="222" width="105" height="50" rx="8" fill="#111827" stroke="#7c3aed" stroke-width="1"/>
  <text x="72" y="238" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#c4b5fd">RGB LED</text>
  <circle cx="40"  cy="255" r="7" fill="#3b82f6" opacity="0.9"/>
  <circle cx="72"  cy="255" r="7" fill="#22c55e" opacity="0.9"/>
  <circle cx="104" cy="255" r="7" fill="#ef4444" opacity="0.9"/>

  <!-- LCD -->
  <rect x="135" y="222" width="85" height="50" rx="8" fill="#1c1205" stroke="#d97706" stroke-width="1"/>
  <text x="177" y="243" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24">LCD 1602</text>
  <text x="177" y="260" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a6030">I2C · PB6/PB7</text>

  <!-- DHT11 -->
  <rect x="235" y="222" width="95" height="50" rx="8" fill="#042f2e" stroke="#0d9488" stroke-width="1"/>
  <text x="282" y="243" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#2dd4bf">DHT11</text>
  <text x="282" y="260" text-anchor="middle" font-family="monospace" font-size="10" fill="#3a7a75">GPIO4</text>

  <!-- UART arrow -->
  <line x1="175" y1="137" x2="235" y2="137" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="205" y="128" text-anchor="middle" font-family="monospace" font-size="9" fill="#a78bfa">UART 115200</text>
  <text x="205" y="149" text-anchor="middle" font-family="monospace" font-size="9" fill="#554a8a">3.3V · direct</text>

  <!-- ESP32 → Mosquitto -->
  <line x1="390" y1="120" x2="450" y2="95" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="438" y="98" text-anchor="middle" font-family="monospace" font-size="9" fill="#3b82f6">MQTT</text>

  <!-- Mosquitto → Dashboard -->
  <line x1="525" y1="115" x2="525" y2="180" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="548" y="153" font-family="monospace" font-size="9" fill="#16a34a">WS</text>

  <!-- STM32 → RGB LED -->
  <line x1="72" y1="180" x2="72" y2="222" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <!-- STM32 → LCD -->
  <line x1="145" y1="180" x2="165" y2="222" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <!-- ESP32 → DHT11 -->
  <line x1="282" y1="180" x2="282" y2="222" stroke="#0d9488" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- Bottom legend -->
  <circle cx="22"  cy="284" r="5" fill="#3b82f6"/>
  <text x="32"  y="288" font-family="monospace" font-size="9" fill="#6080aa">Blue &lt;20°C · cold</text>
  <circle cx="135" cy="284" r="5" fill="#22c55e"/>
  <text x="145" y="288" font-family="monospace" font-size="9" fill="#4a8a5a">Green 20–30°C · normal</text>
  <circle cx="280" cy="284" r="5" fill="#ef4444"/>
  <text x="290" y="288" font-family="monospace" font-size="9" fill="#8a4a4a">Red ≥30°C · hot</text>
  <line x1="415" y1="284" x2="435" y2="284" stroke="#555" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="440" y="288" font-family="monospace" font-size="9" fill="#555">peripheral</text>
</svg>
